# OTA Rollback — manual trigger to restore previous firmware version
# Usage: Go to Actions → OTA Rollback → Run workflow → select version

name: OTA Rollback

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to rollback to (e.g. 4.1.3)'
        required: true

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: List available backups
        run: |
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > deploy_key
          chmod 600 deploy_key
          echo "=== Available backups ==="
          ssh -i deploy_key -o StrictHostKeyChecking=no root@158.160.216.45 \
            "ls -la /home/openclaw/bips-ota/backups/"

      - name: Restore backup on server
        run: |
          VERSION="${{ github.event.inputs.version }}"
          BACKUP_FILE="/home/openclaw/bips-ota/backups/xiaozhi-${VERSION}.bin"

          # Check backup exists
          EXISTS=$(ssh -i deploy_key -o StrictHostKeyChecking=no root@158.160.216.45 \
            "test -f $BACKUP_FILE && echo yes || echo no")
          if [ "$EXISTS" != "yes" ]; then
            echo "::error::No backup found for version $VERSION"
            echo "Available backups:"
            ssh -i deploy_key -o StrictHostKeyChecking=no root@158.160.216.45 \
              "ls /home/openclaw/bips-ota/backups/"
            exit 1
          fi

          # Backup current before rollback
          CURRENT_VER=$(ssh -i deploy_key -o StrictHostKeyChecking=no root@158.160.216.45 \
            "python3 -c \"import json; print(json.load(open('/home/openclaw/bips-ota/ota.json'))['firmware']['version'])\"")
          echo "Current version: $CURRENT_VER"
          echo "Rolling back to: $VERSION"

          # Restore
          ssh -i deploy_key -o StrictHostKeyChecking=no root@158.160.216.45 \
            "cp $BACKUP_FILE /home/openclaw/bips-ota/xiaozhi.bin && \
             python3 -c \"
          import json
          p = '/home/openclaw/bips-ota/ota.json'
          d = json.load(open(p))
          d['firmware']['version'] = '$VERSION'
          json.dump(d, open(p, 'w'), indent=2, ensure_ascii=False)
          print('ota.json updated to $VERSION')
          \""

      - name: Verify rollback
        run: |
          REMOTE_VER=$(ssh -i deploy_key -o StrictHostKeyChecking=no root@158.160.216.45 \
            "python3 -c \"import json; print(json.load(open('/home/openclaw/bips-ota/ota.json'))['firmware']['version'])\"")
          if [ "$REMOTE_VER" != "${{ github.event.inputs.version }}" ]; then
            echo "::error::Rollback failed: server shows $REMOTE_VER"
            exit 1
          fi
          echo "✅ Rollback complete: server is now on $REMOTE_VER"
          echo "Device will update on next OTA check."

      - name: Cleanup
        if: always()
        run: rm -f deploy_key
